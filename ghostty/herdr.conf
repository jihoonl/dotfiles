# Ghostty config for running herdr in a standalone window.
#
# Loaded in addition to ~/.config/ghostty/config (theme, font, opacity), so
# only the herdr-specific bits live here. cmux reads the shared config and
# never sees this file, so its own Cmd shortcuts stay intact.
#
# Launch with the herdr-holiday-desktop function in zshrc, or:
#   open -na Ghostty.app --args --config-file=~/.config/ghostty/herdr.conf \
#     -e herdr --remote <host>
#
# Ghostty speaks the Kitty keyboard protocol, which can encode Cmd/super, and
# herdr decodes it (TERM=xterm-ghostty). So herdr receives Cmd chords directly
# and herdr/config.toml binds them; this file only has to stop Ghostty from
# consuming the ones it binds by default. Triggers are written exactly as
# `ghostty +list-keybinds` prints them, because +validate-config accepts a
# misspelled key name without ever matching it.
#
# Ghostty has NO inline comments: a '#' after a value becomes part of it.
#
# Chords herdr uses that Ghostty leaves alone need no line here: super+i,
# super+b, super+p, super+r, super+shift+r, ctrl+1..9, and the bracket
# chords (ctrl+super, alt+super, alt+super+shift).

# settings / reload config
keybind = super+,=unbind
keybind = super+shift+,=unbind

# tabs
keybind = super+t=unbind
keybind = super+w=unbind

# workspaces
keybind = super+n=unbind
keybind = super+shift+w=unbind

# splits and zoom
keybind = super+d=unbind
keybind = super+shift+d=unbind
keybind = super+shift+enter=unbind

# focus pane
keybind = super+alt+arrow_left=unbind
keybind = super+alt+arrow_down=unbind
keybind = super+alt+arrow_up=unbind
keybind = super+alt+arrow_right=unbind

# switch workspace: Ghostty binds both the '1' and 'digit_1' forms
keybind = super+1=unbind
keybind = super+digit_1=unbind
keybind = super+2=unbind
keybind = super+digit_2=unbind
keybind = super+3=unbind
keybind = super+digit_3=unbind
keybind = super+4=unbind
keybind = super+digit_4=unbind
keybind = super+5=unbind
keybind = super+digit_5=unbind
keybind = super+6=unbind
keybind = super+digit_6=unbind
keybind = super+7=unbind
keybind = super+digit_7=unbind
keybind = super+8=unbind
keybind = super+digit_8=unbind
keybind = super+9=unbind
keybind = super+digit_9=unbind
